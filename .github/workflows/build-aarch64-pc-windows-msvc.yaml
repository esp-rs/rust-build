name: Xtensa Rust | aarch64-pc-windows-msvc

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Xtensa Rust release version to build"
        required: true
        default: '1.98.1.0'
      release_tag:
        description: "Release tag where artifacts will be stored (e.g. v1.98.1.0, untagged-00000)"
        required: true
        default: "v1.98.1.0"
  push:
    branches:
      - test/aarch64-windows-1.99

env:
  LLVM_VERSION: "20.1.3"
  NINJA_VERSION: "1.12.1"

jobs:
  get_release:
    name: Get release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_upload_url.outputs.url }}
    steps:
      - uses: octokit/request-action@v2.x
        id: get_release
        with:
          route: GET /repos/esp-rs/rust-build/releases/tags/${{ github.event.inputs.release_tag || 'v1.99.0.0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: get upload url
        id: get_upload_url
        run: |
          url=$(echo "$response" | jq -r '.upload_url')
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          response: ${{ steps.get_release.outputs.data }}

  build-xtensa-rust:
    name: Build Xtensa Rust
    needs: get_release
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout repository - esp-rs/rust
        uses: actions/checkout@v6
        with:
          path: rust
          repository: esp-rs/rust
          ref: esp-${{ github.event.inputs.release_version || '1.99.0.0' }}
          submodules: true
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force -Path "$tools\ninja" | Out-Null

          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-winarm64.zip" -OutFile "$tools\ninja.zip"
          7z x "-o$tools\ninja" "$tools\ninja.zip"

          # The ring crate requires clang on the PATH when targeting Arm64 Windows.
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-woa64.exe" -OutFile "$tools\llvm.exe"
          7z x "-o$tools\clang" "$tools\llvm.exe"

          "$tools\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$tools\clang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CLANG_CL=$tools\clang\bin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          cmake --version
          ninja --version
          clang-cl --version
          7z i | Select-Object -First 3
      - name: Unmount local drive
        continue-on-error: true
        run: subst "R:" /D
      - name: Map local long path to new drive
        shell: pwsh
        run: subst "R:" "$env:GITHUB_WORKSPACE\rust"
      - name: Prepare build
        working-directory: "R:"
        shell: pwsh
        run: |
          python src/bootstrap/configure.py --build=aarch64-pc-windows-msvc --host=aarch64-pc-windows-msvc --target=aarch64-pc-windows-msvc --experimental-targets=Xtensa --release-channel=nightly --release-description="${{ github.event.inputs.release_version || '1.99.0.0' }}" --enable-extended --tools=rustdoc,clippy,cargo,rustfmt,rust-analyzer-proc-macro-srv,analysis,rust-analysis,src --dist-compression-formats='xz' --enable-lld --enable-profiler --enable-ninja --set "llvm.clang-cl=$env:CLANG_CL"
      - name: Build with x.py - dist packages
        working-directory: "R:"
        continue-on-error: true
        shell: pwsh
        run: |
          python x.py dist --stage 2
      - name: Verify dist packages
        working-directory: "R:/build/dist"
        shell: pwsh
        run: |
          $missing = @(
            "rust-nightly-aarch64-pc-windows-msvc.tar.xz",
            "rust-src-nightly.tar.xz",
            "cargo-nightly-aarch64-pc-windows-msvc.tar.xz",
            "clippy-nightly-aarch64-pc-windows-msvc.tar.xz",
            "rustfmt-nightly-aarch64-pc-windows-msvc.tar.xz"
          ) | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing dist packages: $($missing -join ', ')"
          }
      - name: Repackage binary
        shell: pwsh
        working-directory: "R:/build/dist"
        run: |
          &"$env:GITHUB_WORKSPACE/support/rust-build/Repackage-RustRelease.ps1" -DefaultHost aarch64-pc-windows-msvc
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust/build/dist/rust-${{ github.event.inputs.release_version || '1.99.0.0' }}-aarch64-pc-windows-msvc.zip
          asset_name: rust-${{ github.event.inputs.release_version || '1.99.0.0' }}-aarch64-pc-windows-msvc.zip
          asset_content_type: application/x-tar
      - name: Unmount local drive
        if: always()
        continue-on-error: true
        run: subst "R:" /D
